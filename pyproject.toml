[project]
name = "fabric-defect"
version = "0.1.0"
description = "Unsupervised fabric defect detection with DINOv2 + PatchCore (anomaly score, heatmap, boxes)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Runtime pins live in requirements.txt (the paper's reproducibility contract);
# this section is metadata only, so the two don't drift.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", ".venv", "data"]

[tool.ruff.lint]
# A pragmatic, widely-used set: pyflakes, pycodestyle, import sorting,
# pyupgrade, and bugbear. Intentionally excludes noisy opinionated groups.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E402",  # local imports after a sys.path / env bootstrap (backend, scripts, tests)
    "B008",  # FastAPI declares deps in argument defaults, e.g. File(...) / Depends(...)
]

[tool.ruff.lint.per-file-ignores]
"scripts/inspect_roll.py" = ["E501"]   # embedded HTML/CSS in the report
"scripts/make_confusion.py" = ["E501"]  # long cv2 draw calls

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
