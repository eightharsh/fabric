# Default experiment config -- the single source of truth for hyperparameters.
# scripts/train.py and scripts/calibrate.py read their defaults from here; pass
# --flag on the CLI to override any value. Reported in the paper (see
# paper/outline.md reproducibility checklist).
seed: 0                        # global RNG seed (torch + numpy + coreset)

data:
  root: /content/mvtec        # where MVTec AD is extracted (override: --data-root / DATASET_PATH)
  category: carpet            # textile-like: carpet | leather | grid
  image_size: 224            # divisible by 14 (DINOv2) AND 16 (DINOv3): 224/14=16, 224/16=14

model:
  # Migration target. DINOv3 needs `pip install -r requirements-dinov3.txt` + a
  # Hugging Face token (gated). DINOv2 stays available for the A/B comparison.
  #   dinov3: dinov3_vits16 | dinov3_vitb16 | dinov3_vitl16 | dinov3_vith16plus
  #   dinov2: dinov2_vits14 | dinov2_vitb14 | dinov2_vitl14
  #   cnn   : wide_resnet50_2 (baseline)
  backbone: dinov3_vitl16
  layers: [9]                # DINOv2 block index; ignored for DINOv3 (uses final patch features)
  coreset_ratio: 0.10        # fraction of normal patches kept in memory bank
  n_neighbors: 1             # k in nearest-neighbour scoring
  agg_kernel: 3              # local-aggregation neighbourhood

eval:
  # Box cutoff: "adaptive" = per-image mean + box_k*std (robust on real fabric,
  # where a fixed cutoff floods); or a float in 0-1 for a fixed cutoff.
  box_threshold: adaptive
  box_k: 2.0                 # std multiplier for the adaptive cutoff
  min_box_area: 64           # ignore tiny blobs (noise)

train:
  batch_size: 8              # inference batch size for fit + eval
  n_vis: 6                   # number of qualitative overlays to save
  results_csv: outputs/results.csv   # appended one row per run (paper table)
